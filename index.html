<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Previsão do Tempo</title>
</head>

<body>
    <div class="caixa-maior">
        <div class="caixa-pesquisa">
            <input class="input-cidade" type="text" placeholder="Digite a cidade">

            <button class="botao" onclick="detectaVoz()">
                <img src="./img/icons8-microfone-48.png" alt="microfone" class="img-botao">
            </button>

            <button class="botao" onclick="pesquisar()">
                <img src="./img/icons8-pesquisar-50.png" alt="pesquisar" class="img-botao">
            </button>
        </div>
        <div class="caixa-menor">
            <p class="cidade">Cidade</p>
            <p class="temp">Temp</p>
            <p class="descricao">Descrição</p>
            <p class="umidade">Umidade</p>
        </div>
    </div>
</body>
<script src="config.js"></script>
<script src="script.js"></script>

</html>
